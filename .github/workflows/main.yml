name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify project files
        run: |
          pwd
          ls -la
          test -f project.yml
          test -f Info.plist
          test -f PillOverlayApp.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -e

          rm -rf build
          mkdir -p build/Payload

          xcodebuild \
            -project PillOverlay.xcodeproj \
            -scheme PillOverlay \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build

          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi

          cp -R "$APP" build/Payload/

          cd build
          zip -r PillOverlay-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PillOverlay-unsigned-ipa
          path: build/PillOverlay-unsigned.ipa
