name: PillOverlay

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0

schemes:
  PillOverlay:
    build:
      targets:
        PillOverlay: all
        PillOverlayLiveActivity: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  PillOverlay:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: FloatingPillView.swift
      - path: LiveActivityController.swift
      - path: NotificationManager.swift
      - path: PillActivityAttributes.swift
      - path: PillOverlayApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillOverlay
        INFOPLIST_FILE: App-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: PillOverlay.entitlements
    dependencies:
      - target: PillOverlayLiveActivity
        embed: true

  PillOverlayLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PillActivityAttributes.swift
      - path: PillOverlayLiveActivity.swift
      - path: PillOverlayLiveActivityBundle.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillOverlay.LiveActivity
        INFOPLIST_FILE: LiveActivity-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: PillOverlayLiveActivity.entitlements
